# Preview events and time slots inserted by scripts/seed_preview_events_time_slots.py
# (run AFTER seed_preview_kingdoms_alliances and seed_preview_players).
#
# Fixed ids: events 5001-, time slots 6001-. Event dates are stored as day offsets from the day the
# seed runs (so a freshly seeded DB always has current/upcoming events). Time slot end_time is stored
# as the picked end minus one second (see app/models/schema.py's TimeSlot); confirmed_ind is omitted
# when True (the default). scheduled_*/is_published are the TEMPORARY event columns.

events:
