[project]
name = "kingshot-scheduler"
version = "0.1.0"
description = "Kingshot Event Scheduling Web Application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nicegui>=3.16.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# NiceGUI's `user` fixture runs pages without a main file; tests register the pages they need (see tests/conftest.py).
main_file = ""
